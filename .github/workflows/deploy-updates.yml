name: Deploy OTA Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to deploy to
        required: true
        default: production
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'App.js'
      - 'app.json'
      - 'package.json'

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Deploy OTA update to ${{ github.event.inputs.channel || 'production' }}
        run: npx eas-cli@latest update --channel ${{ github.event.inputs.channel || 'production' }} --non-interactive --auto
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
          EXPO_NO_DOCTOR: "1"
          EXPO_BUNDLER_SKIP_DEPENDENCY_VERSION_VALIDATION: "1"